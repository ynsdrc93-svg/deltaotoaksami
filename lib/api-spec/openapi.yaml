openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Public contact form
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: submitContactForm
      tags: [contact]
      summary: Submit contact form
      description: Delta Oto web sitesindeki iletişim formu gönderimini kaydeder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSubmissionInput"
      responses:
        "201":
          description: Kaydedildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmissionResult"
        "400":
          description: Geçersiz istek
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "429":
          description: Çok fazla istek
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactSubmissionInput:
      type: object
      properties:
        ad:
          type: string
          minLength: 2
        firma:
          type: string
        telefon:
          type: string
        email:
          type: string
          format: email
        konu:
          type: string
        mesaj:
          type: string
          minLength: 5
        website:
          type: string
          description: Honeypot alanı — gerçek kullanıcılar boş bırakır, doldurulmuşsa bot kabul edilir
      required:
        - ad
        - email
        - mesaj
    ContactSubmissionResult:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    ApiErrorBody:
      type: object
      properties:
        error:
          type: string
      required:
        - error


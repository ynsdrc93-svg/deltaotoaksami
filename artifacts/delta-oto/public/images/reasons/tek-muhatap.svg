<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="tmBg" x1="400" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#132C6E"/>
      <stop offset="1" stop-color="#0A0D14"/>
    </linearGradient>
    <radialGradient id="tmGlow" cx="0.72" cy="0.58" r="0.5">
      <stop offset="0" stop-color="#7D9BEA" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7D9BEA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#tmBg)"/>
  <rect width="400" height="300" fill="url(#tmGlow)"/>

  <!-- Multiple scattered points CONVERGING INWARD to one emphasized hub —
       the deliberate visual opposite of "erisim" (which radiates outward
       from a modest center). Outer points are small/faint, the single
       destination node is large/bold. -->
  <g stroke="#4D74D6" stroke-width="1.5" opacity="0.55">
    <line x1="40" y1="40" x2="288" y2="176"/>
    <line x1="130" y1="24" x2="288" y2="176"/>
    <line x1="230" y1="20" x2="288" y2="176"/>
    <line x1="340" y1="36" x2="288" y2="176"/>
    <line x1="30" y1="130" x2="288" y2="176"/>
    <line x1="20" y1="230" x2="288" y2="176"/>
    <line x1="110" y1="270" x2="288" y2="176"/>
    <line x1="360" y1="260" x2="288" y2="176"/>
    <line x1="368" y1="120" x2="288" y2="176"/>
  </g>

  <g fill="#4D74D6" opacity="0.75">
    <circle cx="40" cy="40" r="4.5"/>
    <circle cx="130" cy="24" r="4"/>
    <circle cx="230" cy="20" r="4.5"/>
    <circle cx="340" cy="36" r="4"/>
    <circle cx="30" cy="130" r="4.5"/>
    <circle cx="20" cy="230" r="4"/>
    <circle cx="110" cy="270" r="4.5"/>
    <circle cx="360" cy="260" r="4"/>
    <circle cx="368" cy="120" r="4.5"/>
  </g>

  <!-- The single point of contact -->
  <circle cx="288" cy="176" r="30" fill="#1B3A8F" stroke="#7D9BEA" stroke-width="2.5"/>
  <circle cx="288" cy="176" r="14" fill="#7D9BEA"/>
</svg>

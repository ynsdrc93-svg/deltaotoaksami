<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="erisimBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16358C"/>
      <stop offset="1" stop-color="#0A0D14"/>
    </linearGradient>
    <radialGradient id="erisimGlow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7D9BEA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7D9BEA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#erisimBg)"/>
  <rect width="400" height="300" fill="url(#erisimGlow)"/>

  <!-- Network radiating OUTWARD from a central hub — the visual opposite of
       "tek-muhatap" (which converges inward), so the two read as distinct
       even before the title is legible. -->
  <g stroke="#4D74D6" stroke-width="1.75" opacity="0.7">
    <line x1="200" y1="128" x2="90" y2="60"/>
    <line x1="200" y1="128" x2="200" y2="36"/>
    <line x1="200" y1="128" x2="310" y2="58"/>
    <line x1="200" y1="128" x2="352" y2="140"/>
    <line x1="200" y1="128" x2="330" y2="232"/>
    <line x1="200" y1="128" x2="220" y2="268"/>
    <line x1="200" y1="128" x2="100" y2="250"/>
    <line x1="200" y1="128" x2="52" y2="168"/>
  </g>

  <!-- Outer nodes -->
  <g fill="#7D9BEA">
    <circle cx="90" cy="60" r="7" opacity="0.85"/>
    <circle cx="200" cy="36" r="6" opacity="0.7"/>
    <circle cx="310" cy="58" r="8" opacity="0.9"/>
    <circle cx="352" cy="140" r="6.5" opacity="0.75"/>
    <circle cx="330" cy="232" r="7.5" opacity="0.85"/>
    <circle cx="220" cy="268" r="6" opacity="0.7"/>
    <circle cx="100" cy="250" r="7" opacity="0.8"/>
    <circle cx="52" cy="168" r="6.5" opacity="0.75"/>
  </g>

  <!-- Central hub -->
  <circle cx="200" cy="128" r="20" fill="#1B3A8F" stroke="#7D9BEA" stroke-width="2"/>
  <circle cx="200" cy="128" r="9" fill="#7D9BEA"/>
</svg>

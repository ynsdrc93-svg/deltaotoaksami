    <circle cx="200" cy="150" r="46" stroke-width="3" opacity="0.75"/>
    <circle cx="200" cy="150" r="74" stroke-width="3" opacity="0.6"/>
    <circle cx="200" cy="150" r="104" stroke-width="3" opacity="0.42"/>
    <circle cx="200" cy="150" r="136" stroke-width="3" opacity="0.26"/>
  </g>
  <circle cx="200" cy="150" r="8" fill="#7D9BEA"/>
</svg>
